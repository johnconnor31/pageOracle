name: Package extension

on:
  workflow_dispatch:
  push:
    paths:
      - 'extension/**'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - browser: chrome
            manifest: manifest.json
          - browser: firefox
            manifest: manifest.firefox.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare ${{ matrix.browser }} extension
        run: |
          mkdir -p dist/${{ matrix.browser }}
          cp -R extension/* dist/${{ matrix.browser }}/

          # Copy the correct manifest as manifest.json
          cp extension/${{ matrix.manifest }} dist/${{ matrix.browser }}/manifest.json

          # Remove unused manifest files
          rm -f dist/${{ matrix.browser }}/manifest.firefox.json
          rm -f dist/${{ matrix.browser }}/manifest.json.bak

      - name: Create ${{ matrix.browser }} zip
        run: |
          cd dist/${{ matrix.browser }}
          zip -r ../pageoracle-${{ matrix.browser }}.zip .
          cd ../..
          ls -lh dist/pageoracle-*.zip

      - name: Upload ${{ matrix.browser }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageoracle-${{ matrix.browser }}
          path: dist/pageoracle-${{ matrix.browser }}.zip
          if-no-files-found: error

  commit-zips:
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize zips
        run: |
          mkdir -p dist
          cp artifacts/pageoracle-chrome/pageoracle-chrome.zip dist/
          cp artifacts/pageoracle-firefox/pageoracle-firefox.zip dist/
          ls -lh dist/

      - name: Commit and push zips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp dist/pageoracle-*.zip .
          git add pageoracle-chrome.zip pageoracle-firefox.zip

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: Package pageOracle extensions for Chrome and Firefox"
            git push
          fi
